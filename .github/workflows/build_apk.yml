name: Build Flutter APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          channel: 'stable'

      - name: Clear Pub Cache
        run: rm -rf ~/.pub-cache

      - name: Get Dependencies
        run: flutter pub get

      - name: Make Gradle Executable
        run: chmod +x android/gradlew

      - name: Ensure Gradle Wrapper
        run: |
          mkdir -p android/gradle/wrapper
          curl -sL -o android/gradle/wrapper/gradle-wrapper.jar "https://raw.githubusercontent.com/nicoulaj/gradle-wrapper/refs/heads/main/gradle-wrapper.jar" || \
          curl -sL -o android/gradle/wrapper/gradle-wrapper.jar "https://github.com/nicoulaj/gradle-wrapper/raw/refs/heads/main/gradle-wrapper.jar"
          file android/gradle/wrapper/gradle-wrapper.jar

      - name: Build APK (Release)
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
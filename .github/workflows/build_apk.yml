name: Build Flutter APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          channel: 'stable'

      - name: Clear Pub Cache
        run: rm -rf ~/.pub-cache

      - name: Get Dependencies
        run: flutter pub get

      - name: Make Gradle Executable
        run: chmod +x android/gradlew

      - name: Ensure Gradle Wrapper
        run: |
          curl -sL "https://services.gradle.org/distributions/gradle-8.11.1-bin.zip" -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          find /tmp/gradle-8.11.1 -name "gradle-wrapper.jar" -exec cp {} android/gradle/wrapper/gradle-wrapper.jar \;
          ls -la android/gradle/wrapper/
          file android/gradle/wrapper/gradle-wrapper.jar
          unzip -l android/gradle/wrapper/gradle-wrapper.jar | grep -i gradlewrappermain

      - name: Build APK (Release)
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
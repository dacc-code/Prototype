name: Build Flutter APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          channel: 'stable'

      - name: Clear Pub Cache
        run: rm -rf ~/.pub-cache

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK (Release) with Gradle
        run: |
          export PATH="/opt/hostedtoolcache/Java_Zulu_jdk/17.0.18-8/x64/bin:$PATH"
          cd android && ./gradlew assembleRelease --no-daemon || gradle assembleRelease

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
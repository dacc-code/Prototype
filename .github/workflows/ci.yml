name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.2"
          channel: stable

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        # Solo errores bloquean: hay 3 warnings pre-existentes (TODO).
        # NO tocar _sigmoid sin validar en dispositivo: si los scores YOLO
        # necesitan sigmoide, es un fix de matemática del modelo, no de lint.
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

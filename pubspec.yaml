name: mangrove_disease_detector
description: "App para detección de enfermedades en manglares usando YOLO"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  camera: ^0.10.5+9
  tflite_flutter_custom: ^1.2.5
  image: ^4.1.3
  path_provider: ^2.1.2
  permission_handler: ^11.1.0
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/
